<script>
async function loadShabbosTimes() {
    try {
        const response = await fetch(
            "https://www.hebcal.com/shabbat?cfg=json&geonameid=5206379&m=50"
        );

        const data = await response.json();

        let parsha = "";
        let candles = "";
        let havdalah = "";

        for (const item of data.items) {

            if (item.category === "parashat") {
                parsha = item.title.replace("Parashat ", "");
            }

            if (item.category === "candles") {
                candles = formatTime(item.date);
            }

            if (item.category === "havdalah") {
                havdalah = formatTime(item.date);
            }
        }

        document.getElementById("parsha").innerText = parsha;
        document.getElementById("candles").innerText = candles;
        document.getElementById("havdalah").innerText = havdalah;

    } catch (err) {
        console.error(err);

        document.getElementById("parsha").innerText =
            "Unable to Load";
    }
}

function formatTime(dateString) {
    return new Date(dateString).toLocaleTimeString(
        "en-US",
        {
            hour: "numeric",
            minute: "2-digit"
        }
    );
}

loadShabbosTimes();
setInterval(loadShabbosTimes, 21600000);
</script>
