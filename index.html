<script>
async function loadShabbosTimes() {
    try {

        const response = await fetch(
            "https://www.hebcal.com/shabbat?cfg=json&geonameid=5206379&m=50"
        );

        const data = await response.json();

        console.log("Hebcal data:", data);

        const candlesItem = data.items.find(
            item => item.category === "candles"
        );

        const parshaItem = data.items.find(
            item => item.category === "parashat"
        );

        const havdalahItem = data.items.find(
            item => item.category === "havdalah"
        );

        document.getElementById("parsha").innerText =
            parshaItem
                ? parshaItem.title.replace("Parashat ", "")
                : "Parsha Unavailable";

        document.getElementById("candles").innerText =
            candlesItem
                ? formatTime(candlesItem.date)
                : "--:--";

        document.getElementById("havdalah").innerText =
            havdalahItem
                ? formatTime(havdalahItem.date)
                : "--:--";

    } catch (err) {

        console.error(err);

        document.getElementById("parsha").innerText =
            "Unable to Load";

        document.getElementById("candles").innerText =
            "--:--";

        document.getElementById("havdalah").innerText =
            "--:--";
    }
}

function formatTime(dateString) {

    return new Date(dateString).toLocaleTimeString(
        "en-US",
        {
            hour: "numeric",
            minute: "2-digit"
        }
    );
}

loadShabbosTimes();
setInterval(loadShabbosTimes, 21600000);
</script>
